name: CI

# PR 必跑；main 合并后再跑一次兜底
on:
  pull_request:
    branches:
      - main
      - "feature/**"
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的检查
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 构建期不需要真实密钥：占位值仅用于让类型/构建流程跑通
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
      LLM_API_KEY: "ci-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 规范要求 pnpm 为唯一包管理器
      # TODO(Q5)：仓库换上 pnpm-lock.yaml 后，改为 --frozen-lockfile 并开启缓存
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (含 TypeScript 检查)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: 检查是否误提交了环境变量文件
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::发现被提交的环境变量文件：$tracked"
            exit 1
          fi
